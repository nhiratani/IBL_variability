name: ibl_var_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12.5
  - pip
  - pip:
    # Standard Data Science & Plotting
    - numpy==2.3.5
    - pandas==3.0.5
    - scipy==1.18.0
    - matplotlib==3.11.1
    - seaborn==0.13.2
    - statsmodels==0.14.6
    - beautifulsoup4
    
    # Core Utilities
    - requests==2.34.2
    
    # International Brain Laboratory (IBL) Tools
    - ibllib==4.0.1
    
    # Neurophysiology Tools
    - quantities==0.16.2
    - neo==0.14.3
    - elephant==1.1.1
